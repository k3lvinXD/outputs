<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Logo Matemática II Interactiva</title>
  <desc id="desc">Un símbolo de gradiente turquesa sobre un fondo azul marino.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152e"/>
      <stop offset="1" stop-color="#16416c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#background)"/>
  <circle cx="198" cy="54" r="46" fill="#4385f5" opacity=".2"/>
  <path d="M59 187 128 61l69 126" fill="none" stroke="#44d8c5" stroke-linecap="round" stroke-linejoin="round" stroke-width="22" filter="url(#glow)"/>
  <path d="M86 147h84" fill="none" stroke="#d8fffa" stroke-linecap="round" stroke-width="18"/>
  <circle cx="128" cy="147" r="10" fill="#07152e"/>
</svg>
